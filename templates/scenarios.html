<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Scenarios - S3 Load Testing Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg:#0f172a; --card:#1e293b; --brd:#334155;
            --txt:#e2e8f0; --mut:#94a3b8; --acc:#6366f1; --acc2:#3b82f6;
        }
        * { box-sizing:border-box; }
        body { background:var(--bg); min-height:100vh; padding:20px; font-family:'Segoe UI',system-ui,sans-serif; color:var(--txt); }
        a { color:var(--acc2); text-decoration:none; }
        a:hover { text-decoration:underline; }
        .container-main { max-width:1200px; margin:0 auto; }
        .header { text-align:center; margin-bottom:36px; }
        .header h1 { font-size:2rem; font-weight:700; color:var(--txt); margin:0 0 8px; }
        .header p  { color:var(--mut); font-size:.9rem; margin:0; }
        .back-link { color:var(--acc2); font-size:.9rem; margin-bottom:20px; display:inline-block; }

        /* Cards */
        .card { background:var(--card); border:1px solid var(--brd); border-radius:10px; margin-bottom:22px; }
        .card-header {
            background:transparent; border-bottom:1px solid var(--brd);
            color:var(--txt); border-radius:10px 10px 0 0;
            padding:16px 22px; font-weight:600;
            display:flex; justify-content:space-between; align-items:center;
        }
        .card-header h5 { color:var(--txt)!important; margin:0; }
        .card-body { padding:22px; }

        /* Category badges */
        .scenario-category { display:inline-block; padding:5px 12px; border-radius:20px; font-size:.8rem; font-weight:600; }
        .category-throughput { background:rgba(6,182,212,.15);  color:#22d3ee; }
        .category-iops       { background:rgba(34,197,94,.15);  color:#4ade80; }
        .category-mixed      { background:rgba(245,158,11,.15); color:#fbbf24; }
        .category-metadata   { background:rgba(239,68,68,.15);  color:#f87171; }
        .category-endurance  { background:rgba(99,102,241,.15); color:#a5b4fc; }
        .category-concurrency{ background:rgba(168,85,247,.15); color:#c084fc; }
        .category-real-world { background:rgba(20,184,166,.15); color:#2dd4bf; }

        /* Scenario details */
        .scenario-description { font-size:1rem; color:var(--mut); font-style:italic; margin-bottom:18px; }
        .spec-table { margin-top:16px; width:100%; border-collapse:collapse; }
        .spec-table tr:nth-child(odd) { background:rgba(255,255,255,.03); }
        .spec-table td { padding:10px 14px; border:1px solid var(--brd); color:var(--txt); font-size:.9rem; }
        .spec-label { font-weight:600; color:var(--mut); width:32%; font-size:.82rem; text-transform:uppercase; letter-spacing:.4px; }

        /* Use case box */
        .use-case { background:rgba(99,102,241,.08); border-left:4px solid var(--acc); padding:14px; margin-top:16px; border-radius:5px; }
        .use-case-title { font-weight:600; color:var(--acc); margin-bottom:6px; font-size:.9rem; }

        /* Operation mix */
        .operation-mix { background:var(--bg); border:1px solid var(--brd); padding:14px; border-radius:6px; margin-top:14px; }
        .operation-mix-title { font-weight:600; color:var(--mut); margin-bottom:10px; font-size:.85rem; text-transform:uppercase; letter-spacing:.4px; }
        .operation-bar { display:flex; align-items:center; margin-bottom:8px; }
        .operation-label { width:80px; font-weight:500; font-size:.85rem; color:var(--mut); }
        .operation-percentage {
            flex:1; border-radius:3px; height:26px;
            display:flex; align-items:center; justify-content:center;
            margin:0 10px; color:white; font-weight:600; font-size:.82rem;
        }
        .op-put    { background:#16a34a; }
        .op-get    { background:#0284c7; }
        .op-delete { background:#dc2626; }
        .op-list   { background:#d97706; }

        /* Category overview grid */
        .category-grid {
            display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
            gap:12px; margin-bottom:28px;
            background:var(--card); border:1px solid var(--brd); border-radius:10px; padding:18px;
        }
        .category-item { padding:14px; border-radius:8px; text-align:center; cursor:pointer; transition:transform .2s; }
        .category-item:hover { transform:scale(1.04); }
        .category-item-title { font-weight:600; margin-bottom:4px; font-size:.9rem; }
        .category-item-count { font-size:.8rem; opacity:.8; }

        /* TOC */
        .toc { background:var(--card); border:1px solid var(--brd); padding:18px; border-radius:10px; margin-bottom:28px; }
        .toc-title { font-weight:600; color:var(--txt); margin-bottom:14px; }
        .toc-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px; list-style:none; padding:0; margin:0; }
        .toc-list li { border-left:3px solid var(--acc); padding-left:10px; }
        .toc-list a { color:var(--mut); font-size:.88rem; }
        .toc-list a:hover { color:var(--txt); }
    </style>
</head>
<body>
    <div class="container-main">
        <a href="/" class="back-link">← Back to Tool</a>

        <div class="header">
            <h1>📋 Test Scenarios Guide</h1>
            <p style="margin-bottom: 0; font-size: 0.9rem; opacity: 0.9;">Detailed explanation of all available load testing scenarios</p>
        </div>

        <!-- Category Overview -->
        <div class="category-grid">
            <div class="category-item category-throughput">
                <div class="category-item-title">Throughput</div>
                <div class="category-item-count">Large sequential ops</div>
            </div>
            <div class="category-item category-iops">
                <div class="category-item-title">IOPS</div>
                <div class="category-item-count">Small random ops</div>
            </div>
            <div class="category-item category-mixed">
                <div class="category-item-title">Mixed</div>
                <div class="category-item-count">Realistic workloads</div>
            </div>
            <div class="category-item category-metadata">
                <div class="category-item-title">Metadata</div>
                <div class="category-item-count">High concurrency</div>
            </div>
            <div class="category-item category-endurance">
                <div class="category-item-title">Endurance</div>
                <div class="category-item-count">Extended tests</div>
            </div>
            <div class="category-item category-concurrency">
                <div class="category-item-title">Concurrency</div>
                <div class="category-item-count">Connection scaling</div>
            </div>
        </div>

        <!-- Table of Contents -->
        <div class="toc">
            <div class="toc-title">Quick Navigation</div>
            <ul class="toc-list" id="tocList"></ul>
        </div>

        <!-- Scenarios Container -->
        <div id="scenariosContainer"></div>
    </div>

    <script>
        async function loadScenarios() {
            try {
                const response = await fetch('/api/scenarios/detailed');
                const data = await response.json();

                const container = document.getElementById('scenariosContainer');
                const tocList = document.getElementById('tocList');

                data.scenarios.forEach(scenario => {
                    // Add to TOC
                    const tocItem = document.createElement('li');
                    tocItem.innerHTML = `<a href="#${scenario.key}">${scenario.name}</a>`;
                    tocList.appendChild(tocItem);

                    // Create scenario card
                    const categoryClass = `category-${scenario.category}`;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = scenario.key;

                    // Generate operation mix visualization
                    let operationMixHtml = '';
                    if (scenario.operation_mix && Object.keys(scenario.operation_mix).length > 0) {
                        operationMixHtml = '<div class="operation-mix"><div class="operation-mix-title">Operation Mix:</div>';
                        for (const [op, percentage] of Object.entries(scenario.operation_mix)) {
                            const opClass = `op-${op}`;
                            operationMixHtml += `
                                <div class="operation-bar">
                                    <div class="operation-label">${op.toUpperCase()}</div>
                                    <div class="operation-percentage ${opClass}" style="width: ${percentage}%">${percentage}%</div>
                                </div>
                            `;
                        }
                        operationMixHtml += '</div>';
                    }

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <h5 style="margin: 0; color: white;">${scenario.name}</h5>
                            </div>
                            <span class="scenario-category ${categoryClass}">${scenario.category.toUpperCase()}</span>
                        </div>
                        <div class="card-body">
                            <div class="scenario-description">${scenario.description}</div>

                            <table class="spec-table">
                                <tr>
                                    <td class="spec-label">Concurrent Operations</td>
                                    <td><strong>${scenario.concurrent_ops}</strong> parallel threads</td>
                                </tr>
                                <tr>
                                    <td class="spec-label">Operations per Thread</td>
                                    <td><strong>${scenario.operations_per_thread}</strong> ops</td>
                                </tr>
                                <tr>
                                    <td class="spec-label">Total Operations</td>
                                    <td><strong>${scenario.concurrent_ops * scenario.operations_per_thread}</strong> total</td>
                                </tr>
                                <tr>
                                    <td class="spec-label">Object Size</td>
                                    <td><strong>${formatBytes(scenario.object_size_bytes)}</strong></td>
                                </tr>
                                ${scenario.duration_limit ? `
                                <tr>
                                    <td class="spec-label">Duration Limit</td>
                                    <td><strong>${scenario.duration_limit}</strong> seconds</td>
                                </tr>
                                ` : ''}
                            </table>

                            ${operationMixHtml}

                            <div class="use-case">
                                <div class="use-case-title">💡 When to Use</div>
                                <div>${scenario.use_case || 'Use this scenario to test ' + scenario.category + ' performance characteristics.'}</div>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading scenarios:', error);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Load scenarios on page load
        loadScenarios();
    </script>
</body>
</html>
